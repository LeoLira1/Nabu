name: Publish Android Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar projeto Android
        run: flutter create --platforms=android --project-name=nabu .

      - name: Configurar Android 7+
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Compilar APK de produção
        run: flutter build apk --release

      - name: Preparar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk nabu-v0.2.0.apk

      - name: Publicar Nabu v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 nabu-v0.2.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nabu v0.2.0" \
            --notes "Agora o Nabu importa imagens da galeria e permite configurar o Turso dentro do aplicativo, testar a conexão, criar as tabelas automaticamente e guardar o token com segurança no aparelho."
